services:
  gtr1-core:
    build: .
    container_name: gtr1_fat_container
    ports:
      - "8000:8000"  # HTTP Dashboard
      - "8080:8080"  # WebSockets Bridge
    # Опционально монтируем код, чтобы не пересобирать образ при каждом чихе
    volumes:
      - .:/app
    # Подключение видеокарты NVIDIA для ML-моделей
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
